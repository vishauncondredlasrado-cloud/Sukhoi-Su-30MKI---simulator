<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Sukhoi Su-30MKI Flight Simulator</title>

<style>

html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    width:100%;
    height:100%;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#hud{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    background:rgba(0,0,0,.55);
    padding:14px;
    border-radius:10px;
    font-size:14px;
    line-height:1.7;
    min-width:190px;
    pointer-events:none;
}

#title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:5px;
}

#controls{
    position:absolute;
    bottom:15px;
    left:15px;
    color:white;
    background:rgba(0,0,0,.55);
    padding:12px;
    border-radius:10px;
    font-size:13px;
    line-height:1.6;
    pointer-events:none;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:25px;
    pointer-events:none;
}

</style>
</head>

<body>

<div id="hud">

    <div id="title">
        SU-30MKI FLIGHT SIMULATOR
    </div>

    Speed:
    <span id="speed">180</span> km/h<br>

    Altitude:
    <span id="altitude">500</span> m<br>

    Heading:
    <span id="heading">0</span>°<br>

    Pitch:
    <span id="pitch">0</span>°<br>

    Roll:
    <span id="roll">0</span>°<br>

    Throttle:
    <span id="throttle">45</span>%

</div>


<div id="controls">

    <b>CONTROLS</b><br>

    W / S — Pitch<br>
    A / D — Turn<br>
    Q / E — Roll<br>
    ↑ / ↓ — Throttle<br>
    F — Level Flight<br>
    Space — Airbrake<br>
    R — Reset Aircraft<br>
    C — Reset Camera<br>
    Mouse Drag — Look Around<br>
    Mouse Wheel — Zoom

</div>


<div id="crosshair">+</div>


<script type="importmap">
{
    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from "three";


/* =====================================================
   SCENE
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x87ceeb
    );

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        700,
        5000
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        65,
        window.innerWidth /
        window.innerHeight,
        0.1,
        20000
    );

camera.position.set(
    18,
    7,
    18
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled =
    true;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x557799,
        1.5
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.2
    );

sun.position.set(
    -500,
    1000,
    400
);

sun.castShadow = true;

scene.add(sun);


/* =====================================================
   MATERIALS
===================================================== */

/* Main light grey */

const lightGrey =
    new THREE.MeshStandardMaterial({
        color:0x8c9192,
        metalness:0.72,
        roughness:0.30
    });


/* Dark grey camouflage */

const darkGrey =
    new THREE.MeshStandardMaterial({
        color:0x4f5558,
        metalness:0.78,
        roughness:0.32
    });


/* Dark metal */

const darkMetal =
    new THREE.MeshStandardMaterial({
        color:0x303538,
        metalness:0.85,
        roughness:0.25
    });


/* Engine metal */

const engineMetal =
    new THREE.MeshStandardMaterial({
        color:0x62686b,
        metalness:0.90,
        roughness:0.22
    });


/* Turquoise-green cockpit */

const cockpitGreen =
    new THREE.MeshStandardMaterial({
        color:0x20e0c0,
        emissive:0x063f36,
        metalness:0.25,
        roughness:0.18
    });


/* Canopy */

const glass =
    new THREE.MeshStandardMaterial({
        color:0x132e32,
        metalness:0.30,
        roughness:0.08,
        transparent:true,
        opacity:0.72
    });


/* Orange eye */

const orangeEye =
    new THREE.MeshStandardMaterial({
        color:0xff6600,
        metalness:0.65,
        roughness:0.25
    });


const eyeBlack =
    new THREE.MeshStandardMaterial({
        color:0x050505,
        metalness:0.65,
        roughness:0.20
    });


const eyeGrey =
    new THREE.MeshStandardMaterial({
        color:0xaeb4b5,
        metalness:0.65,
        roughness:0.25
    });


/* Engine glow */

const exhaustMaterial =
    new THREE.MeshBasicMaterial({
        color:0xff8a00
    });


/* =====================================================
   AIRCRAFT GROUP
===================================================== */

const aircraft =
    new THREE.Group();

scene.add(aircraft);


/* =====================================================
   HELPER
===================================================== */

function addPart(
    geometry,
    material,
    x=0,
    y=0,
    z=0
){

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;

    mesh.receiveShadow = true;

    aircraft.add(mesh);

    return mesh;
}


/* =====================================================
   MAIN FUSELAGE
===================================================== */

const fuselage =
    addPart(
        new THREE.CapsuleGeometry(
            1.45,
            10,
            12,
            24
        ),
        lightGrey
    );

fuselage.rotation.z =
    Math.PI / 2;

fuselage.scale.set(
    1,
    1,
    0.72
);


/* =====================================================
   CAMOUFLAGE
===================================================== */

const rearPatch =
    addPart(
        new THREE.SphereGeometry(
            1.32,
            24,
            16
        ),
        darkGrey,
        2.25,
        0,
        0
    );

rearPatch.scale.set(
    1.7,
    0.95,
    0.72
);


const lowerCamo =
    addPart(
        new THREE.SphereGeometry(
            1,
            24,
            16
        ),
        darkGrey,
        0.6,
        -0.8,
        0
    );

lowerCamo.scale.set(
    2.2,
    0.4,
    0.75
);


const upperCamo =
    addPart(
        new THREE.SphereGeometry(
            1,
            24,
            16
        ),
        darkGrey,
        3.5,
        0.55,
        0
    );

upperCamo.scale.set(
    2,
    0.38,
    0.65
);


/* =====================================================
   INWARD TAPERED NOSE
===================================================== */

function makeNoseSection(
    x,
    radius,
    length
){

    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius * 0.82,
            length,
            24
        );

    const part =
        addPart(
            geometry,
            lightGrey,
            x,
            0,
            0
        );

    part.rotation.z =
        Math.PI / 2;

    return part;
}


makeNoseSection(
    -4.8,
    1.25,
    1.8
);

makeNoseSection(
    -6.0,
    0.95,
    1.2
);

makeNoseSection(
    -7.0,
    0.65,
    1.0
);

makeNoseSection(
    -7.8,
    0.35,
    0.8
);


/* Nose tip */

const noseTip =
    addPart(
        new THREE.ConeGeometry(
            0.35,
            1.5,
            24
        ),
        darkGrey,
        -8.75,
        0,
        0
    );

noseTip.rotation.z =
    -Math.PI / 2;


/* =====================================================
   COCKPIT
===================================================== */

const cockpit =
    addPart(
        new THREE.SphereGeometry(
            1.15,
            24,
            16
        ),
        cockpitGreen,
        -1.7,
        0.65,
        0
    );

cockpit.scale.set(
    1.55,
    0.55,
    0.75
);


/* Front canopy */

const canopy =
    addPart(
        new THREE.SphereGeometry(
            0.9,
            24,
            16
        ),
        glass,
        -2.3,
        1.05,
        0
    );

canopy.scale.set(
    1.5,
    0.55,
    0.72
);


/* Rear canopy */

const canopyRear =
    addPart(
        new THREE.SphereGeometry(
            0.8,
            24,
            16
        ),
        glass,
        -0.1,
        0.95,
        0
    );

canopyRear.scale.set(
    1.3,
    0.45,
    0.68
);


/* =====================================================
   LONG FLAT WINGS
===================================================== */

function createWing(side){

    const vertices =
        new Float32Array([

        -3.2, 0.05, side*0.7,
         1.8, 0.05, side*11.8,
         4.7, 0.05, side*10.2,
         3.4, 0.05, side*0.7,

        -3.2,-0.05, side*0.7,
         1.8,-0.05, side*11.8,
         4.7,-0.05, side*10.2,
         3.4,-0.05, side*0.7

    ]);


    const indices = [

        0,1,2,
        0,2,3,

        4,6,5,
        4,7,6,

        0,4,5,
        0,5,1,

        1,5,6,
        1,6,2,

        2,6,7,
        2,7,3,

        3,7,4,
        3,4,0
    ];


    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            vertices,
            3
        )
    );

    geometry.setIndex(
        indices
    );

    geometry.computeVertexNormals();


    return addPart(
        geometry,
        lightGrey
    );
}


createWing(1);

createWing(-1);


/* =====================================================
   WING CAMOUFLAGE
===================================================== */

function createWingCamo(side){

    const patch =
        addPart(
            new THREE.BoxGeometry(
                4.8,
                0.08,
                3.5
            ),
            darkGrey,
            2.6,
            0.03,
            side*7.5
        );

    patch.rotation.y =
        side*0.12;
}

createWingCamo(1);

createWingCamo(-1);


/* =====================================================
   WING ROOTS
===================================================== */

function createWingRoot(side){

    const root =
        addPart(
            new THREE.BoxGeometry(
                3.5,
                0.35,
                2.1
            ),
            darkGrey,
            0,
            -0.05,
            side
        );

    root.rotation.y =
        side*0.15;
}

createWingRoot(1);

createWingRoot(-1);


/* =====================================================
   CANARDS
===================================================== */

function createCanard(side){

    const shape =
        new THREE.Shape();

    shape.moveTo(0,0);

    shape.lineTo(
        -0.5,
        0.25
    );

    shape.lineTo(
        3.0,
        2.7
    );

    shape.lineTo(
        2.4,
        0
    );

    shape.closePath();


    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth:0.12,
                bevelEnabled:true,
                bevelSize:0.04,
                bevelThickness:0.03
            }
        );


    const canard =
        addPart(
            geometry,
            darkGrey,
            -1.8,
            0.1,
            side*1.25
        );

    canard.rotation.x =
        Math.PI / 2;
}

createCanard(1);

createCanard(-1);


/* =====================================================
   ENGINE NACELLES
===================================================== */

function createEngine(side){

    const engine =
        addPart(
            new THREE.CylinderGeometry(
                0.72,
                0.82,
                4.8,
                24
            ),
            engineMetal,
            3.5,
            -0.25,
            side*1.25
        );

    engine.rotation.z =
        Math.PI / 2;
}

createEngine(1);

createEngine(-1);


/* =====================================================
   ENGINE INTAKES
===================================================== */

function createIntake(side){

    const intake =
        addPart(
            new THREE.CylinderGeometry(
                0.88,
                0.7,
                1.2,
                24,
                1,
                true
            ),
            darkMetal,
            1.0,
            -0.25,
            side*1.25
        );

    intake.rotation.z =
        Math.PI / 2;
}

createIntake(1);

createIntake(-1);


/* =====================================================
   EXHAUST NOZZLES
===================================================== */

function createNozzle(side){

    const nozzle =
        addPart(
            new THREE.CylinderGeometry(
                0.68,
                0.82,
                1.4,
                20,
                1,
                true
            ),
            engineMetal,
            7.0,
            -0.25,
            side*1.25
        );

    nozzle.rotation.z =
        Math.PI / 2;
}

createNozzle(1);

createNozzle(-1);


/* =====================================================
   ENGINE GLOW
===================================================== */

function createGlow(side){

    const glow =
        addPart(
            new THREE.CylinderGeometry(
                0.38,
                0.62,
                1.1,
                20
            ),
            exhaustMaterial,
            7.7,
            -0.25,
            side*1.25
        );

    glow.rotation.z =
        Math.PI / 2;
}

createGlow(1);

createGlow(-1);


/* =====================================================
   TWIN VERTICAL TAILS
===================================================== */

function createTail(side){

    const tail =
        addPart(
            new THREE.BoxGeometry(
                2.8,
                2.8,
                0.18
            ),
            darkGrey,
            4.8,
            1.2,
            side*0.75
        );

    tail.rotation.z =
        side*0.38;
}

createTail(1);

createTail(-1);


/* =====================================================
   HORIZONTAL TAILPLANES
===================================================== */

function createTailPlane(side){

    const shape =
        new THREE.Shape();

    shape.moveTo(0,0);

    shape.lineTo(
        3.8,
        2.8
    );

    shape.lineTo(
        4.6,
        2.1
    );

    shape.lineTo(
        1.8,
        0
    );

    shape.closePath();


    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth:0.12,
                bevelEnabled:true,
                bevelSize:0.04
            }
        );


    const plane =
        addPart(
            geometry,
            darkGrey,
            3.2,
            0,
            side*0.8
        );

    plane.rotation.x =
        Math.PI/2;
}

createTailPlane(1);

createTailPlane(-1);


/* =====================================================
   ORANGE EYE STRUCTURES
===================================================== */

function createEye(side){

    /*
       Position moved forward so the eyes
       are clearly visible from the side.
    */

    const x = -3.2;

    const y = 0.20;

    const z = side*1.38;


    /* Orange outer circle */

    const outer =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.60,
                0.60,
                0.12,
                48
            ),
            orangeEye
        );

    outer.position.set(
        x,
        y,
        z
    );

    outer.rotation.x =
        Math.PI/2;

    aircraft.add(outer);


    /* Black inner circle */

    const inner =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.43,
                0.43,
                0.14,
                48
            ),
            eyeBlack
        );

    inner.position.set(
        x,
        y,
        z + side*0.075
    );

    inner.rotation.x =
        Math.PI/2;

    aircraft.add(inner);


    /* Grey centre */

    const center =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.27,
                0.27,
                0.16,
                48
            ),
            eyeGrey
        );

    center.position.set(
        x,
        y,
        z + side*0.15
    );

    center.rotation.x =
        Math.PI/2;

    aircraft.add(center);


    /* Black pupil */

    const pupil =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.12,
                0.12,
                0.18,
                48
            ),
            eyeBlack
        );

    pupil.position.set(
        x,
        y,
        z + side*0.24
    );

    pupil.rotation.x =
        Math.PI/2;

    aircraft.add(pupil);
}


createEye(1);

createEye(-1);


/* =====================================================
   LANDING GEAR
===================================================== */

function createWheel(
    x,
    y,
    z
){

    const wheel =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.38,
                0.38,
                0.22,
                20
            ),
            eyeBlack
        );

    wheel.position.set(
        x,
        y,
        z
    );

    wheel.rotation.z =
        Math.PI/2;

    aircraft.add(wheel);
}


createWheel(
    -0.8,
    -2,
    0
);

createWheel(
    2.8,
    -2,
    1.1
);

createWheel(
    2.8,
    -2,
    -1.1
);


/* =====================================================
   RUNWAY
===================================================== */

const runway =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            10000,
            80
        ),
        new THREE.MeshStandardMaterial({
            color:0x292929,
            roughness:0.9
        })
    );

runway.rotation.x =
    -Math.PI/2;

runway.position.y =
    -3;

runway.receiveShadow =
    true;

scene.add(runway);


/* =====================================================
   RUNWAY MARKINGS
===================================================== */

const lineMaterial =
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });


for(
    let x=-4800;
    x<5000;
    x+=80
){

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                35,
                0.04,
                1.2
            ),
            lineMaterial
        );

    line.position.set(
        x,
        -2.94,
        0
    );

    scene.add(line);
}


/* =====================================================
   GROUND
===================================================== */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            20000,
            20000
        ),
        new THREE.MeshStandardMaterial({
            color:0x4f7145,
            roughness:1
        })
    );

ground.rotation.x =
    -Math.PI/2;

ground.position.y =
    -3.15;

ground.receiveShadow =
    true;

scene.add(ground);


/* =====================================================
   MOUNTAINS
===================================================== */

function createMountain(
    x,
    z,
    height,
    width
){

    const mountain =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                width,
                height,
                7
            ),
            new THREE.MeshStandardMaterial({
                color:0x4b5b61,
                roughness:1
            })
        );

    mountain.position.set(
        x,
        height/2-3,
        z
    );

    scene.add(mountain);
}


for(
    let i=0;
    i<25;
    i++
){

    const x =
        -3000 +
        Math.random()*6000;

    const z =
        -700 -
        Math.random()*1000;

    const height =
        250 +
        Math.random()*600;

    const width =
        250 +
        Math.random()*400;

    createMountain(
        x,
        z,
        height,
        width
    );
}


/* =====================================================
   CLOUDS
===================================================== */

function createCloud(
    x,
    y,
    z
){

    const cloud =
        new THREE.Group();


    for(
        let i=0;
        i<7;
        i++
    ){

        const sphere =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    35 +
                    Math.random()*30,
                    16,
                    16
                ),
                new THREE.MeshStandardMaterial({
                    color:0xffffff,
                    roughness:1
                })
            );

        sphere.position.set(
            (Math.random()-.5)*100,
            (Math.random()-.5)*35,
            (Math.random()-.5)*70
        );

        cloud.add(sphere);
    }


    cloud.position.set(
        x,
        y,
        z
    );

    scene.add(cloud);
}


for(
    let i=0;
    i<35;
    i++
){

    createCloud(
        -4000+
        Math.random()*8000,

        500+
        Math.random()*1000,

        -1200+
        Math.random()*1800
    );
}


/* =====================================================
   START POSITION
===================================================== */

aircraft.position.set(
    0,
    500,
    0
);


/* =====================================================
   FLIGHT VARIABLES
===================================================== */

let speed = 180;

let throttle = 45;

let pitch = 0;

let roll = 0;

let heading = 0;


/* =====================================================
   KEYBOARD
===================================================== */

const keys = {};


window.addEventListener(
    "keydown",
    function(event){

        keys[event.code] = true;


        /* Reset */

        if(
            event.code === "KeyR"
        ){

            aircraft.position.set(
                0,
                500,
                0
            );

            speed = 180;

            throttle = 45;

            pitch = 0;

            roll = 0;

            heading = 0;

            aircraft.rotation.set(
                0,
                0,
                0
            );
        }


        /* Level flight */

        if(
            event.code === "KeyF"
        ){

            pitch = 0;

            roll = 0;
        }


        /* Camera reset */

        if(
            event.code === "KeyC"
        ){

            cameraYaw = 0;

            cameraPitch = 0;

            cameraDistance = 18;
        }

    }
);


window.addEventListener(
    "keyup",
    function(event){

        keys[event.code] = false;

    }
);


/* =====================================================
   MOUSE CAMERA
===================================================== */

let mouseDown = false;

let previousMouseX = 0;

let previousMouseY = 0;

let cameraYaw = 0;

let cameraPitch = 0;


renderer.domElement.addEventListener(
    "mousedown",
    function(event){

        mouseDown = true;

        previousMouseX =
            event.clientX;

        previousMouseY =
            event.clientY;
    }
);


window.addEventListener(
    "mouseup",
    function(){

        mouseDown = false;
    }
);


window.addEventListener(
    "mousemove",
    function(event){

        if(!mouseDown)
            return;


        const dx =
            event.clientX -
            previousMouseX;

        const dy =
            event.clientY -
            previousMouseY;


        previousMouseX =
            event.clientX;

        previousMouseY =
            event.clientY;


        cameraYaw -=
            dx*0.004;

        cameraPitch -=
            dy*0.004;


        cameraPitch =
            Math.max(
                -1.2,
                Math.min(
                    1.2,
                    cameraPitch
                )
            );
    }
);


/* =====================================================
   MOUSE ZOOM
===================================================== */

let cameraDistance = 18;


window.addEventListener(
    "wheel",
    function(event){

        cameraDistance +=
            event.deltaY*0.025;


        cameraDistance =
            Math.max(
                7,
                Math.min(
                    60,
                    cameraDistance
                )
            );
    }
);


/* =====================================================
   FLIGHT UPDATE
===================================================== */

const clock =
    new THREE.Clock();


function updateFlight(delta){

    /* =========================
       PITCH
    ========================= */

    if(
        keys["KeyW"]
    ){

        pitch +=
            0.7*delta;
    }


    if(
        keys["KeyS"]
    ){

        pitch -=
            0.7*delta;
    }


    /* =========================
       YAW
    ========================= */

    let yawInput = 0;


    if(
        keys["KeyA"]
    ){

        yawInput = 1;
    }


    if(
        keys["KeyD"]
    ){

        yawInput = -1;
    }


    /*
       IMPORTANT:
       Heading changes only while
       A or D is actually being held.
    */

    heading +=
        yawInput *
        0.8 *
        delta;


    /* =========================
       ROLL
    ========================= */

    if(
        keys["KeyQ"]
    ){

        roll +=
            1.2*delta;
    }


    if(
        keys["KeyE"]
    ){

        roll -=
            1.2*delta;
    }


    /* =========================
       THROTTLE
    ========================= */

    if(
        keys["ArrowUp"]
    ){

        throttle +=
            25*delta;
    }


    if(
        keys["ArrowDown"]
    ){

        throttle -=
            25*delta;
    }


    throttle =
        Math.max(
            0,
            Math.min(
                100,
                throttle
            )
        );


    /* =========================
       SPEED
    ========================= */

    let targetSpeed =
        100 +
        throttle*5;


    if(
        keys["Space"]
    ){

        targetSpeed *=
            0.65;
    }


    speed +=
        (
            targetSpeed -
            speed
        ) *
        delta *
        0.7;


    /* =========================
       ROTATION LIMITS
    ========================= */

    pitch =
        Math.max(
            -1.1,
            Math.min(
                1.1,
                pitch
            )
        );


    roll =
        Math.max(
            -1.3,
            Math.min(
                1.3,
                roll
            )
        );


    /* =========================
       APPLY ROTATION
    ========================= */

    aircraft.rotation.x =
        pitch;

    aircraft.rotation.y =
        heading;

    aircraft.rotation.z =
        roll;


    /* =========================
       FORWARD MOVEMENT
    ========================= */

    const direction =
        new THREE.Vector3(
            1,
            0,
            0
        );


    direction.applyQuaternion(
        aircraft.quaternion
    );


    const movement =
        speed *
        delta *
        0.45;


    aircraft.position.add(
        direction.multiplyScalar(
            movement
        )
    );


    /* =========================
       ALTITUDE
    ========================= */

    if(
        aircraft.position.y < 30
    ){

        aircraft.position.y =
            30;
    }


    aircraft.position.y +=
        Math.sin(pitch) *
        speed *
        delta *
        0.08;

}


/* =====================================================
   CAMERA UPDATE
===================================================== */

function updateCamera(){

    const offset =
        new THREE.Vector3(
            -cameraDistance,
            7,
            0
        );


    offset.applyAxisAngle(
        new THREE.Vector3(
            0,
            1,
            0
        ),
        cameraYaw
    );


    offset.y +=
        Math.sin(
            cameraPitch
        )*12;


    camera.position.copy(
        aircraft.position
    ).add(
        offset
    );


    const target =
        aircraft.position.clone();


    target.y +=
        Math.sin(
            cameraPitch
        )*30;


    target.x +=
        15;


    camera.lookAt(
        target
    );
}


/* =====================================================
   HUD UPDATE
===================================================== */

function updateHUD(){

    document.getElementById(
        "speed"
    ).textContent =
        Math.round(speed);


    document.getElementById(
        "altitude"
    ).textContent =
        Math.round(
            aircraft.position.y
        );


    let headingDegrees =
        THREE.MathUtils.radToDeg(
            heading
        ) % 360;


    if(
        headingDegrees < 0
    ){

        headingDegrees += 360;
    }


    document.getElementById(
        "heading"
    ).textContent =
        Math.round(
            headingDegrees
        );


    document.getElementById(
        "pitch"
    ).textContent =
        Math.round(
            THREE.MathUtils.radToDeg(
                pitch
            )
        );


    document.getElementById(
        "roll"
    ).textContent =
        Math.round(
            THREE.MathUtils.radToDeg(
                roll
            )
        );


    document.getElementById(
        "throttle"
    ).textContent =
        Math.round(
            throttle
        );
}


/* =====================================================
   ANIMATION LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    updateFlight(
        delta
    );


    updateCamera();


    updateHUD();


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =====================================================
   WINDOW RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>
